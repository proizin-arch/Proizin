<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="İzinPro geçici şifre değişimi">
  <title>Şifrenizi Değiştirin | İzinPro</title>
  <link rel="stylesheet" href="/vendor/inter/400.css"><link rel="stylesheet" href="/vendor/inter/500.css"><link rel="stylesheet" href="/vendor/inter/600.css"><link rel="stylesheet" href="/vendor/inter/700.css">
  <link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/login.css">
</head>
<body class="auth-page password-page">
  <div class="language-switcher" role="group" aria-label="Dil seçimi"><button type="button" data-language="tr" aria-label="Türkçe"><span class="language-flag" aria-hidden="true">🇹🇷</span><span>TR</span></button><button type="button" data-language="en" aria-label="English"><span class="language-flag" aria-hidden="true">🇺🇸</span><span>EN</span></button></div>
  <main class="password-shell">
    <section class="password-card">
      <div class="mobile-brand brand"><img src="/assets/logo-mark.svg" alt=""><span>İzinPro</span></div>
      <span class="security-mark"><img src="/icons/shield-check.svg" alt=""></span>
      <span class="eyebrow">HESAP GÜVENLİĞİ</span>
      <h1>Yeni şifrenizi belirleyin</h1>
      <p>Hesabınız için yalnızca sizin bildiğiniz güçlü bir şifre oluşturun.</p>
      <form id="password-form" novalidate>
        <div class="field"><label for="newPassword">Yeni şifre</label><div class="password-field-wrap"><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required><button class="icon-button password-visibility" type="button" data-password-toggle="newPassword" aria-label="Şifreyi göster"><img src="/icons/eye.svg" alt=""></button></div><small>En az 8 karakter; büyük/küçük harf, rakam ve özel karakter.</small></div>
        <div class="field"><label for="passwordConfirm">Yeni şifre tekrar</label><div class="password-field-wrap"><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required><button class="icon-button password-visibility" type="button" data-password-toggle="passwordConfirm" aria-label="Şifreyi göster"><img src="/icons/eye.svg" alt=""></button></div></div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="button button-primary button-block" type="submit"><span>Şifreyi Kaydet ve Devam Et</span></button>
      </form>
      <button class="button button-ghost button-block" id="logout-button" type="button">Başka hesapla giriş yap</button>
    </section>
  </main>
  <script src="/js/i18n.js"></script><script src="/js/api.js"></script><script src="/js/change-password.js"></script>
</body>
</html>
