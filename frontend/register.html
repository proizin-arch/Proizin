<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="İzinPro personel hesabı oluşturma">
  <title>Kayıt Ol | İzinPro</title>
  <link rel="stylesheet" href="/vendor/inter/400.css"><link rel="stylesheet" href="/vendor/inter/500.css"><link rel="stylesheet" href="/vendor/inter/600.css"><link rel="stylesheet" href="/vendor/inter/700.css">
  <link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/login.css">
</head>
<body class="auth-page register-page">
  <main class="register-shell">
    <header class="register-header">
      <a class="brand" href="/"><img src="/assets/logo-mark.svg" alt=""><span>İzinPro</span></a>
      <a class="back-link" href="/login.html"><img src="/icons/arrow-left.svg" alt=""> Giriş ekranına dön</a>
    </header>
    <section class="register-card">
      <div class="register-intro"><span class="eyebrow">PERSONEL KAYDI</span><h1>Hesabınızı oluşturun</h1><p>Bilgilerinizi eksiksiz girin. Yeni hesaplar Personel rolüyle oluşturulur.</p></div>
      <form id="register-form" class="form-grid" novalidate>
        <div class="field"><label for="firstName">Ad</label><input id="firstName" name="firstName" required maxlength="60"></div>
        <div class="field"><label for="lastName">Soyad</label><input id="lastName" name="lastName" required maxlength="60"></div>
        <div class="field"><label for="birthDate">Doğum tarihi <span>(isteğe bağlı)</span></label><input id="birthDate" name="birthDate" type="date"></div>
        <div class="field"><label for="email">E-posta</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="phone">Telefon <span>(isteğe bağlı)</span></label><input id="phone" name="phone" type="tel" maxlength="30"></div>
        <div class="field"><label for="departmentId">Departman</label><select id="departmentId" name="departmentId" required><option value="">Departman seçin</option></select></div>
        <div class="field"><label for="position">Pozisyon</label><input id="position" name="position" required maxlength="100"></div>
        <div class="field"><label for="hireDate">İşe giriş tarihi</label><input id="hireDate" name="hireDate" type="date" required></div>
        <div class="field field-wide"><label for="address">Adres <span>(isteğe bağlı)</span></label><textarea id="address" name="address" rows="2" maxlength="300"></textarea></div>
        <div class="field"><label for="password">Şifre</label><input id="password" name="password" type="password" autocomplete="new-password" required><small>En az 8 karakter; büyük/küçük harf, rakam ve özel karakter.</small></div>
        <div class="field"><label for="passwordConfirm">Şifre tekrar</label><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required></div>
        <p class="form-error field-wide" id="form-error" role="alert" hidden></p>
        <div class="form-actions field-wide"><a class="button button-secondary" href="/login.html">Vazgeç</a><button class="button button-primary" type="submit">Hesap Oluştur <img src="/icons/arrow-right.svg" alt=""></button></div>
      </form>
    </section>
  </main>
  <script src="/js/api.js"></script><script src="/js/register.js"></script>
</body>
</html>
